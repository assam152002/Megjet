name: Apply Alcohol Market Images
on:
  push:
    branches: [main]
    paths:
      - apply-alcohol-images.cjs
      - .github/workflows/apply-alcohol-images.yml
permissions:
  contents: write
jobs:
  apply-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply and verify generic images
        run: |
          node apply-alcohol-images.cjs
          node -e 'const fs=require("fs"),s=fs.readFileSync("index.html","utf8");const blocks=s.split("<script").slice(1).map(x=>x.slice(x.indexOf(">")+1,x.indexOf("</script>")));for(const b of blocks)new Function(b);if(!s.includes("MEGJET_ALCOHOL_IMAGES"))throw Error("images missing")'
          rm apply-alcohol-images.cjs
          rm .github/workflows/apply-alcohol-images.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html apply-alcohol-images.cjs .github/workflows/apply-alcohol-images.yml
          git commit -m "Add generic Alcohol Market images [skip ci]"
          git push origin main
