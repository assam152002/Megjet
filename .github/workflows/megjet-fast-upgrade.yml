name: Megjet Clean Cart Rebuild

on:
  push:
    paths:
      - '.github/workflows/megjet-fast-upgrade.yml'

permissions:
  contents: write

jobs:
  rebuild-cart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove previous cart patches and install one clean cart
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')

          # Remove every later experimental cart patch by known IDs.
          ids=[
            'megjet-customer-cart-fix-v2-style','megjet-customer-cart-fix-v2-js',
            'megjet-customer-cart-final-css','megjet-customer-cart-final-js',
            'megjet-customer-cart-launcher-style','megjet-customer-cart-launcher-js',
            'megjet-persistent-cart-css','megjet-persistent-cart-js',
            'megjet-clean-cart-css','megjet-clean-cart-js'
          ]
          for i in ids:
            t=re.sub(r'<style[^>]*id=["\']'+re.escape(i)+r'["\'][^>]*>.*?</style>','',t,flags=re.S|re.I)
            t=re.sub(r'<script[^>]*id=["\']'+re.escape(i)+r'["\'][^>]*>.*?</script>','',t,flags=re.S|re.I)

          css=r'''<style id="megjet-clean-cart-css">
          #cartBox.mj-clean-cart{
            position:fixed!important;left:12px!important;right:12px!important;
            bottom:84px!important;z-index:2147482000!important;margin:0 auto!important;
            max-width:720px!important;background:#fff!important;border:1px solid #d9eaf3!important;
            border-radius:20px!important;box-shadow:0 18px 50px rgba(11,39,72,.22)!important;
            overflow:hidden!important
          }
          #cartBox.mj-clean-cart.hidden{display:none!important}
          #cartBox.mj-clean-cart:not(.hidden){display:block!important}
          #cartBox.mj-clean-cart .cart-head{padding:12px 14px!important;min-height:54px!important}
          #cartBox.mj-clean-cart .cart-body{max-height:58vh;overflow:auto}
          #cartBox.mj-clean-cart .row{gap:10px}
          #cartBox.mj-clean-cart .mj-qty{display:inline-flex;align-items:center;gap:7px;margin-left:8px}
          #cartBox.mj-clean-cart .mj-qty button{width:28px;height:28px;padding:0!important;border-radius:9px!important}
          @media(min-width:761px){#cartBox.mj-clean-cart{left:auto!important;right:20px!important;bottom:20px!important;width:430px!important}}
          </style>'''

          js=r'''<script id="megjet-clean-cart-js">
          (function(){
            'use strict';
            const KEY='megjet_cart';
            const $=id=>document.getElementById(id);
            const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
            const money=v=>{try{return new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY'}).format(Number(v||0));}catch(e){return '₺'+Number(v||0).toFixed(2)}};

            function state(){
              if(!Array.isArray(window.cart)) window.cart=[];
              return window.cart;
            }
            function save(){try{localStorage.setItem(KEY,JSON.stringify(state()))}catch(e){}}
            function portalOpen(){
              return ['admin','vendor','rider'].some(id=>{
                const e=$(id); if(!e)return false;
                const s=getComputedStyle(e);
                return !e.classList.contains('hidden')&&s.display!=='none'&&s.visibility!=='hidden';
              });
            }
            function mount(){
              const box=$('cartBox');
              if(!box)return null;
              if(box.parentElement!==document.body)document.body.appendChild(box);
              box.classList.add('mj-clean-cart');
              return box;
            }
            function qty(){return state().reduce((a,x)=>a+Math.max(1,Number(x.quantity||1)),0)}
            function sub(){return state().reduce((a,x)=>a+Number(x.price||0)*Math.max(1,Number(x.quantity||1)),0)}
            function delivery(){return typeof window.DELIVERY!=='undefined'?Number(window.DELIVERY||0):(typeof DELIVERY!=='undefined'?Number(DELIVERY||0):0)}

            function draw(){
              const box=mount(); if(!box)return;
              const n=qty(), subtotal=sub(), del=delivery(), grand=subtotal+del;
              if($('count'))$('count').textContent=n+' item'+(n===1?'':'s');
              if($('cartBadge'))$('cartBadge').textContent=n;
              if($('subtotal'))$('subtotal').textContent=money(subtotal);
              if($('cartDelivery'))$('cartDelivery').textContent=money(del);
              if($('total'))$('total').textContent=money(grand);
              if($('cartTotal'))$('cartTotal').textContent=money(grand);
              if($('checkoutBtn'))$('checkoutBtn').classList.toggle('hidden',!n);
              const items=$('cartItems');
              if(items)items.innerHTML=state().map((x,i)=>{
                const q=Math.max(1,Number(x.quantity||1));
                return '<div class="row"><span><b>'+esc(x.name||'Item')+'</b>'+(x.vendor_name?'<div class="cart-vendor">'+esc(x.vendor_name)+'</div>':'')+
                '<span class="mj-qty"><button type="button" data-mj-minus="'+i+'">−</button><b>'+q+'</b><button type="button" data-mj-plus="'+i+'">+</button></span>'+
                ' <button type="button" class="secondary" data-mj-remove="'+i+'">Remove</button></span><span>'+money(Number(x.price||0)*q)+'</span></div>';
              }).join('');
              const hide=!n||portalOpen();
              box.classList.toggle('hidden',hide);
              box.style.display=hide?'none':'block';
              const nav=$('mjNavCartBadge');
              if(nav){nav.textContent=n>99?'99+':String(n);nav.hidden=!n}
              save();
            }

            function addProduct(product){
              if(!product)return false;
              const a=state(), id=String(product.id??''), vendor=String(product.vendor_id??'');
              const found=a.find(x=>String(x.id??'')===id&&String(x.vendor_id??'')===vendor);
              if(found)found.quantity=Math.max(1,Number(found.quantity||1))+1;
              else a.push({...product,price:Number(product.price||0),quantity:1});
              draw();
              return false;
            }

            window.megjetAddDirect=function(token){
              const p=token&&window.MEGJET_CART_PRODUCTS?window.MEGJET_CART_PRODUCTS[token]:null;
              if(!p){console.error('Megjet cart product missing',token);return false}
              return addProduct(p);
            };
            window.MEGJET_ADD_FROM_BUTTON=function(button,event){
              if(event){event.preventDefault();event.stopPropagation()}
              return window.megjetAddDirect(button&&button.getAttribute('data-megjet-add-id'));
            };

            document.addEventListener('click',e=>{
              const minus=e.target.closest&&e.target.closest('[data-mj-minus]');
              const plus=e.target.closest&&e.target.closest('[data-mj-plus]');
              const rem=e.target.closest&&e.target.closest('[data-mj-remove]');
              if(!minus&&!plus&&!rem)return;
              e.preventDefault();e.stopPropagation();
              const a=state();
              if(plus){const i=Number(plus.dataset.mjPlus);if(a[i])a[i].quantity=Math.max(1,Number(a[i].quantity||1))+1}
              if(minus){const i=Number(minus.dataset.mjMinus);if(a[i]){const q=Math.max(1,Number(a[i].quantity||1));if(q<=1)a.splice(i,1);else a[i].quantity=q-1}}
              if(rem){const i=Number(rem.dataset.mjRemove);if(a[i])a.splice(i,1)}
              draw();
            },true);

            function init(){
              mount();
              try{
                const saved=JSON.parse(localStorage.getItem(KEY)||'[]');
                if(Array.isArray(saved)&&(!Array.isArray(window.cart)||!window.cart.length))window.cart=saved;
              }catch(e){}
              draw();
              window.addEventListener('hashchange',draw);
              window.addEventListener('pageshow',draw);
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
          })();
          </script>'''

          t=t.replace('</head>',css+'\n</head>')
          t=t.replace('</body>',js+'\n</body>')
          p.write_text(t,encoding='utf-8')
          PY

      - name: Validate whole app and clean cart
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          t=Path('index.html').read_text(encoding='utf-8')
          assert t.count('id="megjet-clean-cart-css"')==1
          assert t.count('id="megjet-clean-cart-js"')==1
          for bad in ['megjet-customer-cart-fix-v2-js','megjet-customer-cart-final-js','megjet-persistent-cart-js']:
              assert bad not in t, bad
          for marker in ['window.MEGJET_ADD_FROM_BUTTON=function','data-mj-minus','data-mj-plus','data-mj-remove','localStorage.setItem(KEY']:
              assert marker in t, marker
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',t,re.I|re.S)
          for i,code in enumerate(scripts):
              f=Path('/tmp')/f'megjet_{i}.js';f.write_text(code,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode: raise SystemExit(f'Inline JS {i} failed: '+r.stderr)
          print('PASS: whole Megjet inline JavaScript + clean cart syntax')
          PY

      - name: Commit clean cart
        shell: bash
        run: |
          if git diff --quiet -- index.html; then echo "No changes"; exit 0; fi
          git config user.name "Megjet Rebuild Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild customer cart cleanly"
          git push
