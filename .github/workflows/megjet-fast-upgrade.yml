name: Megjet Customer Cart Final Fix

on:
  push:
    paths:
      - '.github/workflows/megjet-fast-upgrade.yml'

permissions:
  contents: write

jobs:
  fix-cart-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject independent customer cart launcher
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          css='''<style id="megjet-customer-cart-final-css">
          #mjCustomerCartBar{display:none;position:fixed;left:10px;right:10px;bottom:max(78px,env(safe-area-inset-bottom));z-index:2147483000;background:#0b2748;color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:18px;box-shadow:0 12px 35px rgba(11,39,72,.28);padding:10px 12px;align-items:center;gap:10px}
          #mjCustomerCartBar.show{display:flex}#mjCustomerCartBar .mjcb-main{flex:1;min-width:0}#mjCustomerCartBar .mjcb-title{font-weight:900;font-size:14px}#mjCustomerCartBar .mjcb-sub{font-size:12px;opacity:.82;margin-top:2px}#mjCustomerCartBar button{background:#18b7ee!important;color:#06233b!important;border:0!important;border-radius:12px!important;padding:10px 13px!important;font-weight:900!important;white-space:nowrap!important}
          @media(min-width:761px){#mjCustomerCartBar{left:auto;right:18px;bottom:18px;width:390px}}
          </style>'''
          js='''<script id="megjet-customer-cart-final-js">
          (function(){'use strict';
            const $=id=>document.getElementById(id);
            function isCustomer(){return !['#admin','#vendor','#rider'].includes((location.hash||'').toLowerCase());}
            function items(){return Array.isArray(window.cart)?window.cart:[];}
            function count(){return items().reduce((s,x)=>s+Math.max(1,Number(x&&x.quantity||1)),0);}
            function subtotal(){return items().reduce((s,x)=>s+Number(x&&x.price||0)*Math.max(1,Number(x&&x.quantity||1)),0);}
            function money(v){try{return new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2}).format(Number(v||0));}catch(e){return '₺'+Number(v||0).toFixed(2);}}
            function ensureBar(){let bar=$('mjCustomerCartBar');if(bar)return bar;bar=document.createElement('div');bar.id='mjCustomerCartBar';bar.innerHTML='<div class="mjcb-main"><div class="mjcb-title">Your cart</div><div class="mjcb-sub" id="mjCustomerCartText">0 items</div></div><button type="button" id="mjCustomerCartOpen">View cart</button>';document.body.appendChild(bar);$('mjCustomerCartOpen').addEventListener('click',openCart);return bar;}
            function makeCartIndependent(){const box=$('cartBox');if(box&&box.parentElement!==document.body)document.body.appendChild(box);}
            function refresh(){const bar=ensureBar(),n=count(),customer=isCustomer();bar.classList.toggle('show',customer&&n>0);const text=$('mjCustomerCartText');if(text)text.textContent=n+' item'+(n===1?'':'s')+' • '+money(subtotal());const box=$('cartBox');if(!customer&&box){box.classList.add('hidden');box.style.display='none';}return n;}
            function openCart(){makeCartIndependent();const box=$('cartBox'),body=$('cartBody'),toggle=$('cartToggle');if(!box||!count())return;box.classList.remove('hidden');box.style.setProperty('display','block','important');box.style.setProperty('visibility','visible','important');box.style.setProperty('opacity','1','important');if(body){body.classList.add('open');body.style.setProperty('display','block','important');}if(toggle)toggle.textContent='Hide Cart';}
            function afterAdd(){makeCartIndependent();refresh();if(isCustomer())openCart();}
            function bind(){ensureBar();makeCartIndependent();refresh();const old=window.MEGJET_ADD_FROM_BUTTON;if(typeof old==='function'&&!old.__mjCustomerFinal){const wrapped=function(button,event){const r=old.call(this,button,event);setTimeout(afterAdd,0);setTimeout(afterAdd,80);return r};wrapped.__mjCustomerFinal=true;window.MEGJET_ADD_FROM_BUTTON=wrapped;}const oldRender=window.renderCart;if(typeof oldRender==='function'&&!oldRender.__mjCustomerFinal){const rr=function(){const r=oldRender.apply(this,arguments);makeCartIndependent();refresh();return r};rr.__mjCustomerFinal=true;window.renderCart=rr;}document.addEventListener('click',e=>{if(e.target.closest('button[data-megjet-add-id]'))setTimeout(afterAdd,120);},true);window.addEventListener('hashchange',()=>{makeCartIndependent();refresh();});setInterval(refresh,1200);}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind,{once:true});else bind();
          })();
          </script>'''
          if 'id="megjet-customer-cart-final-css"' not in t:t=t.replace('</head>',css+'\n</head>')
          if 'id="megjet-customer-cart-final-js"' not in t:t=t.replace('</body>',js+'\n</body>')
          p.write_text(t,encoding='utf-8')
          PY
      - name: Validate final cart fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          t=Path('index.html').read_text(encoding='utf-8')
          for marker in ['megjet-customer-cart-final-js','mjCustomerCartBar','MEGJET_ADD_FROM_BUTTON']:
              assert marker in t, marker
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',t,re.I|re.S)
          for i,code in enumerate(scripts):
              f=Path('/tmp')/f'mj_{i}.js';f.write_text(code,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode: raise SystemExit(r.stderr)
          print('PASS final customer cart launcher and JS syntax')
          PY
      - name: Commit final cart fix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "Megjet Cart Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Make customer cart independent and always accessible"
          git push
