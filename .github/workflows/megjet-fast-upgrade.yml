name: Megjet Vendor Auth Fix
on:
  push:
    paths:
      - '.github/workflows/megjet-fast-upgrade.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch vendor provisioning
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          t=p.read_text(encoding="utf-8")
          old='''    resetVendorForm();$("vendorForm").classList.add("hidden");$("vendorMessage").textContent=(result?.message||"Vendor saved successfully")+" ✓";
    await loadAdminMenu();await load();'''
          new='''    if(password){
      $("vendorMessage").textContent="Creating vendor login…";
      const token=localStorage.getItem("megjet_access_token");
      if(!token)throw new Error("Admin sign-in required to create vendor login.");
      const provision=await fetchJson(cfg.url.replace(/\\/+$/,"")+"/functions/v1/admin-provision-vendor",{method:"POST",headers:{apikey:cfg.key,Authorization:"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({vendor_id:String(result?.vendor_id||id||""),phone,password})},30000);
      if(!provision?.success)throw new Error(provision?.error||"Vendor login could not be created.");
    }
    resetVendorForm();$("vendorForm").classList.add("hidden");$("vendorMessage").textContent=(result?.message||"Vendor saved successfully")+" ✓";
    await loadAdminMenu();await load();'''
          if "admin-provision-vendor" not in t:
              if old not in t:
                  raise SystemExit("saveVendor target not found")
              t=t.replace(old,new,1)
          t=t.replace("p_vendor_id:vendor_id","p_vendor_id:vendorId")
          assert "admin-provision-vendor" in t
          p.write_text(t,encoding="utf-8")
          PY
      - name: Validate JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path("index.html").read_text(encoding="utf-8")
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',t,flags=re.S|re.I)
          Path("/tmp/megjet-inline.js").write_text("\n".join(scripts),encoding="utf-8")
          PY
          node --check /tmp/megjet-inline.js
      - name: Commit app fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix vendor authentication provisioning"
          git push
