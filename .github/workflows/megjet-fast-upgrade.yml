name: Megjet Customer Cart Fix

on:
  push:
    paths:
      - '.github/workflows/megjet-fast-upgrade.yml'

permissions:
  contents: write

jobs:
  fix-cart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make cart customer-owned and always visible after Add
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')

          STYLE=r'''
          <style id="megjet-customer-cart-fix-v2-style">
          #cartBox.mj-customer-cart-root{
            position:fixed!important;
            z-index:2147483000!important;
            left:12px!important;
            right:12px!important;
            bottom:86px!important;
            width:auto!important;
            max-width:740px!important;
            margin:0 auto!important;
            background:#fff!important;
            border:1px solid #d8eaf3!important;
            border-radius:18px!important;
            box-shadow:0 16px 46px rgba(11,39,72,.24)!important;
          }
          #cartBox.mj-customer-cart-root.hidden{display:none!important}
          #cartBox.mj-customer-cart-root:not(.hidden){display:block}
          #cartBox.mj-customer-cart-root .cart-head{min-height:52px}
          @media(min-width:761px){#cartBox.mj-customer-cart-root{bottom:18px!important}}
          </style>
          '''

          SCRIPT=r'''
          <script id="megjet-customer-cart-fix-v2-js">
          (function(){
            'use strict';
            const $=id=>document.getElementById(id);
            const isPortal=()=>['#admin','#vendor','#rider'].includes((location.hash||'').toLowerCase());
            const countItems=()=>Array.isArray(window.cart)?window.cart.reduce((s,x)=>s+Math.max(1,Number(x&&x.quantity||1)),0):0;

            function mountCart(){
              const box=$('cartBox');
              if(!box)return null;
              if(box.parentElement!==document.body) document.body.appendChild(box);
              box.classList.add('mj-customer-cart-root');
              return box;
            }

            function syncCustomerCart(openBody){
              const box=mountCart();
              if(!box)return;
              const n=countItems();
              if(isPortal()){
                box.style.display='none';
                return;
              }
              if(!n){
                box.classList.add('hidden');
                box.style.display='none';
                return;
              }
              box.classList.remove('hidden');
              box.style.display='block';
              if(openBody){
                const body=$('cartBody');
                if(body){body.classList.add('open');body.style.display='block';}
                const toggle=$('cartToggle');
                if(toggle)toggle.textContent='Hide Cart';
              }
              const navBadge=$('mjNavCartBadge');
              if(navBadge){navBadge.textContent=n>99?'99+':String(n);navBadge.hidden=false;}
            }

            function afterAdd(){
              setTimeout(()=>{
                try{if(typeof window.renderCart==='function')window.renderCart();}catch(e){}
                syncCustomerCart(false);
              },0);
            }

            function init(){
              mountCart();
              try{if(typeof window.renderCart==='function')window.renderCart();}catch(e){}
              syncCustomerCart(false);

              document.addEventListener('click',function(e){
                const add=e.target.closest&&e.target.closest('button[data-megjet-add-id]');
                if(add)afterAdd();
              },false);

              window.addEventListener('hashchange',()=>setTimeout(()=>syncCustomerCart(false),0));

              const box=$('cartBox');
              if(box){
                new MutationObserver(()=>{
                  if(!isPortal()&&countItems()>0){
                    box.classList.remove('hidden');
                    box.style.display='block';
                  }
                }).observe(box,{attributes:true,subtree:true,childList:true});
              }
            }

            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init,{once:true});
            else init();
          })();
          </script>
          '''

          if 'id="megjet-customer-cart-fix-v2-style"' not in text:
              text=text.replace('</head>',STYLE+'\n</head>')
          if 'id="megjet-customer-cart-fix-v2-js"' not in text:
              text=text.replace('</body>',SCRIPT+'\n</body>')

          p.write_text(text,encoding='utf-8')
          PY

      - name: Validate cart fix and JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          t=Path('index.html').read_text(encoding='utf-8')
          required=[
            'id="cartBox"',
            'megjet-customer-cart-fix-v2-style',
            'megjet-customer-cart-fix-v2-js',
            "document.body.appendChild(box)",
            "button[data-megjet-add-id]"
          ]
          missing=[x for x in required if x not in t]
          if missing: raise SystemExit('Missing cart fix markers: '+str(missing))
          if t.count('window.MEGJET_ADD_FROM_BUTTON=function')!=1:
              raise SystemExit('Unexpected Add handler count')
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',t,re.I|re.S)
          for i,code in enumerate(scripts):
              f=Path('/tmp')/f'megjet_{i}.js'
              f.write_text(code,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode:
                  raise SystemExit(f'JS syntax failure in script {i}: '+r.stderr)
          print(f'PASS: {len(scripts)} inline scripts; cart mounted to body for customers; Add listener present')
          PY

      - name: Commit cart fix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes required"
            exit 0
          fi
          git config user.name "Megjet Cart Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix customer cart visibility"
          git push
