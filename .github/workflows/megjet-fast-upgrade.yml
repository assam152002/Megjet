name: Megjet Persistent Customer Cart Fix

on:
  push:
    paths:
      - '.github/workflows/megjet-fast-upgrade.yml'

permissions:
  contents: write

jobs:
  fix-persistent-cart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace conflicting cart launcher
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          t=p.read_text(encoding='utf-8')

          css=r'''<style id="megjet-customer-cart-final-css">
          #mjCustomerCartBar{display:none;position:fixed;left:10px;right:10px;bottom:max(78px,env(safe-area-inset-bottom));z-index:2147483000;background:#0b2748;color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:18px;box-shadow:0 12px 35px rgba(11,39,72,.28);padding:10px 12px;align-items:center;gap:10px}
          #mjCustomerCartBar.show{display:flex!important}
          #mjCustomerCartBar .mjcb-main{flex:1;min-width:0}
          #mjCustomerCartBar .mjcb-title{font-weight:900;font-size:14px}
          #mjCustomerCartBar .mjcb-sub{font-size:12px;opacity:.82;margin-top:2px}
          #mjCustomerCartBar button{background:#18b7ee!important;color:#06233b!important;border:0!important;border-radius:12px!important;padding:10px 13px!important;font-weight:900!important;white-space:nowrap!important}
          @media(min-width:761px){#mjCustomerCartBar{left:auto;right:18px;bottom:18px;width:390px}}
          </style>'''

          js=r'''<script id="megjet-customer-cart-final-js">
          (function(){'use strict';
            const $=id=>document.getElementById(id);

            function liveItems(){
              if(Array.isArray(window.cart) && window.cart.length) return window.cart;
              try{
                const saved=JSON.parse(localStorage.getItem('megjet_cart')||'[]');
                return Array.isArray(saved)?saved:[];
              }catch(e){ return []; }
            }
            function count(){return liveItems().reduce((s,x)=>s+Math.max(1,Number(x&&x.quantity||1)),0);}
            function subtotal(){return liveItems().reduce((s,x)=>s+Number(x&&x.price||0)*Math.max(1,Number(x&&x.quantity||1)),0);}
            function money(v){try{return new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2}).format(Number(v||0));}catch(e){return '₺'+Number(v||0).toFixed(2);}}

            function portalVisible(){
              return ['admin','vendor','rider'].some(id=>{
                const el=$(id); if(!el) return false;
                const st=getComputedStyle(el);
                return !el.classList.contains('hidden') && st.display!=='none' && st.visibility!=='hidden';
              });
            }

            function ensureBar(){
              let bar=$('mjCustomerCartBar');
              if(bar) return bar;
              bar=document.createElement('div');
              bar.id='mjCustomerCartBar';
              bar.innerHTML='<div class="mjcb-main"><div class="mjcb-title">Your cart</div><div class="mjcb-sub" id="mjCustomerCartText">0 items</div></div><button type="button" id="mjCustomerCartOpen">View cart</button>';
              document.body.appendChild(bar);
              $('mjCustomerCartOpen').addEventListener('click',openCart);
              return bar;
            }

            function makeCartIndependent(){
              const box=$('cartBox');
              if(box && box.parentElement!==document.body) document.body.appendChild(box);
            }

            function closeLegacyCart(){
              const box=$('cartBox'),body=$('cartBody'),toggle=$('cartToggle');
              if(body){body.classList.remove('open');body.style.setProperty('display','none','important');}
              if(box){box.classList.add('hidden');box.style.setProperty('display','none','important');}
              if(toggle) toggle.textContent='View Cart';
            }

            function refresh(){
              const bar=ensureBar(), n=count(), portal=portalVisible();
              bar.classList.toggle('show',!portal && n>0);
              const text=$('mjCustomerCartText');
              if(text) text.textContent=n+' item'+(n===1?'':'s')+' • '+money(subtotal());
              if(portal) closeLegacyCart();
              return n;
            }

            function openCart(){
              if(!count() || portalVisible()) return;
              makeCartIndependent();
              const box=$('cartBox'),body=$('cartBody'),toggle=$('cartToggle');
              if(!box) return;
              box.classList.remove('hidden');
              box.style.setProperty('display','block','important');
              box.style.setProperty('visibility','visible','important');
              box.style.setProperty('opacity','1','important');
              if(body){body.classList.add('open');body.style.setProperty('display','block','important');}
              if(toggle) toggle.textContent='Hide Cart';
            }

            function afterAdd(){
              makeCartIndependent();
              closeLegacyCart();
              refresh();
            }

            function installDirectAdd(){
              const original=window.megjetAddDirect;
              if(typeof original!=='function' || original.__mjPersistentCart) return;
              const direct=function(token){
                const product=(token && window.MEGJET_CART_PRODUCTS)?window.MEGJET_CART_PRODUCTS[token]:null;
                let result=false;
                if(product && typeof window.add==='function'){
                  result=window.add({...product,price:Number(product.price||0),quantity:1});
                }else{
                  result=original.call(this,token);
                }
                afterAdd();
                requestAnimationFrame(afterAdd);
                setTimeout(afterAdd,60);
                setTimeout(afterAdd,180);
                return false;
              };
              direct.__mjPersistentCart=true;
              window.megjetAddDirect=direct;
            }

            function bind(){
              ensureBar();
              makeCartIndependent();
              installDirectAdd();
              closeLegacyCart();
              refresh();

              // Keep the compact customer cart persistent, but never auto-open the large cart.
              document.addEventListener('click',e=>{
                if(e.target.closest('button[data-megjet-add-id]')){
                  setTimeout(()=>{installDirectAdd();afterAdd();},0);
                  setTimeout(afterAdd,120);
                }
              },true);

              window.addEventListener('hashchange',()=>{closeLegacyCart();refresh();});
              window.addEventListener('pageshow',refresh);
              window.addEventListener('storage',refresh);
              setInterval(()=>{installDirectAdd();refresh();},700);
            }

            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',bind,{once:true});
            else bind();
          })();
          </script>'''

          style_pat=r'<style id="megjet-customer-cart-final-css">.*?</style>'
          script_pat=r'<script id="megjet-customer-cart-final-js">.*?</script>'

          if re.search(style_pat,t,re.S):
              t=re.sub(style_pat,lambda m:css,t,count=1,flags=re.S)
          else:
              t=t.replace('</head>',css+'\n</head>')

          if re.search(script_pat,t,re.S):
              t=re.sub(script_pat,lambda m:js,t,count=1,flags=re.S)
          else:
              t=t.replace('</body>',js+'\n</body>')

          p.write_text(t,encoding='utf-8')
          PY

      - name: Validate persistent cart fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          t=Path('index.html').read_text(encoding='utf-8')
          assert t.count('id="megjet-customer-cart-final-js"')==1
          assert t.count('id="megjet-customer-cart-final-css"')==1
          for marker in ['function portalVisible()','function closeLegacyCart()','window.megjetAddDirect=direct','never auto-open the large cart']:
              assert marker in t, marker
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',t,re.I|re.S)
          for i,code in enumerate(scripts):
              f=Path('/tmp')/f'mj_{i}.js';f.write_text(code,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode: raise SystemExit(f'JS syntax failure in script {i}: '+r.stderr)
          print('PASS: persistent customer cart fix and all inline JS syntax')
          PY

      - name: Commit persistent cart fix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then echo 'No index changes'; exit 0; fi
          git config user.name "Megjet Cart Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Keep customer cart visible after adding items"
          git push
