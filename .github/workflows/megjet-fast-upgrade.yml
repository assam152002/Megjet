name: Megjet Vendor Auth Fix
on:
  push:
    paths:
      - '.github/workflows/megjet-fast-upgrade.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and validate vendor provisioning
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          t=p.read_text(encoding="utf-8")
          old='    resetVendorForm();$("vendorForm").classList.add("hidden");$("vendorMessage").textContent=(result?.message||"Vendor saved successfully")+" ✓";'
          new='    if(password){\n      $("vendorMessage").textContent="Creating vendor login…";\n      const token=localStorage.getItem("megjet_access_token");\n      if(!token)throw new Error("Admin sign-in required to create vendor login.");\n      const provision=await fetchJson(cfg.url.replace(/\/+$/,"")+"/functions/v1/admin-provision-vendor",{method:"POST",headers:{apikey:cfg.key,Authorization:"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({vendor_id:String(result?.vendor_id||id||""),phone,password})},30000);\n      if(!provision?.success)throw new Error(provision?.error||"Vendor login could not be created.");\n    }\n    resetVendorForm();$("vendorForm").classList.add("hidden");$("vendorMessage").textContent=(result?.message||"Vendor saved successfully")+" ✓";'
          bad='    if(password){\\n'
          if bad in t:
              start=t.index(bad)
              end=t.index('\n    await loadAdminMenu();await load();',start)
              fixed=new+'\n    await loadAdminMenu();await load();'
              t=t[:start]+fixed+t[end+len('\n    await loadAdminMenu();await load();'):]
          elif "admin-provision-vendor" not in t:
              if old not in t: raise SystemExit("saveVendor target not found")
              t=t.replace(old,new,1)
          t=t.replace("p_vendor_id:vendor_id","p_vendor_id:vendorId")
          assert "admin-provision-vendor" in t
          p.write_text(t,encoding="utf-8")
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path("index.html").read_text(encoding="utf-8")
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',t,flags=re.S|re.I)
          Path("/tmp/megjet.js").write_text("\n".join(scripts),encoding="utf-8")
          PY
          node --check /tmp/megjet.js
      - name: Commit app fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Repair vendor auth JavaScript"
          git push
