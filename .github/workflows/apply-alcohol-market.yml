name: Apply Megjet Alcohol Market Update
on:
  push:
    branches: [main]
    paths:
      - apply-alcohol-market.cjs
      - .github/workflows/apply-alcohol-market.yml
permissions:
  contents: write
jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply and verify update
        run: |
          node apply-alcohol-market.cjs
          node -e 'const fs=require("fs"),s=fs.readFileSync("index.html","utf8");const blocks=s.split("<script").slice(1).map(x=>x.slice(x.indexOf(">")+1,x.indexOf("</script>")));for(const b of blocks)new Function(b);console.log("All HTML scripts parse successfully")'
          rm apply-alcohol-market.cjs
          rm megjet-alcohol-market.patch
          rm .github/workflows/apply-alcohol-market.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html apply-alcohol-market.cjs megjet-alcohol-market.patch .github/workflows/apply-alcohol-market.yml
          git commit -m "Add Alcohol Market coming soon preview [skip ci]"
          git push origin main
