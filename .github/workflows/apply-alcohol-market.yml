name: Apply Megjet Alcohol Market Update
on:
  push:
    branches: [main]
    paths:
      - megjet-alcohol-market.patch
      - .github/workflows/apply-alcohol-market.yml
permissions:
  contents: write
jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply tested update
        run: |
          git apply megjet-alcohol-market.patch
          rm megjet-alcohol-market.patch
          rm .github/workflows/apply-alcohol-market.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html megjet-alcohol-market.patch .github/workflows/apply-alcohol-market.yml
          git commit -m "Add Alcohol Market coming soon preview [skip ci]"
          git push origin main
